plugins {
    id 'com.android.application'
}

android {
    namespace "com.softnoesis.shakebugexample"
    compileSdk 36

    defaultConfig {
        applicationId "com.softnoesis.shakebugexample"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Transitive dependencies required by ShakeBug SDK AAR
    implementation 'com.softnoesis.shakebug:ShakeBug:1.2.52'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.airbnb.android:lottie:3.6.0'
    implementation 'com.jaredrummler:android-device-names:1.0.9'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'com.google.android.exoplayer:exoplayer:2.17.1'
    implementation 'com.akexorcist:localization:1.2.9'
    implementation 'com.google.code.gson:gson:2.9.0'
}